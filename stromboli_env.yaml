name: STROMBOLI
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Versions are pinned for reproducibility. samtools must be >= 1.16 for
  # `samtools consensus`; snakemake is pinned to v8 so the documented
  # `--software-deployment-method conda` flag is available.
  - python =3.12
  - pandas >=2.0
  - snakemake >=8.0,<9
  - samtools >=1.19
  - bcftools >=1.19
  - minimap2 >=2.26
  - cutadapt >=4.6
  - starcode >=1.4
  - tqdm >=4.66
  - pytest >=8.0
  - pip
  - pip:
    - cyvcf2>=0.30
    - biopython>=1.83
    - biocode>=0.11
